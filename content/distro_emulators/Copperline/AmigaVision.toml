# Copperline looks up these filenames in its roms and harddrives folders.
rom = "AmigaVision.rom"

[cpu]
model = "68040"
fpu = true
clock_mhz = 25.0
dcache = true

[emulation]
warp_boot = true
auto_launch = true

[memory]
fast = "8M"

[machine]
profile = "A1200"

[audio]
stereo_separation = 50

[copperhf]
unit0 = "AmigaVision.hdf"

# These RDB images supply their own partition names and boot priorities.
unit1 = "AmigaVision-Saves.hdf"

[display]
scaling = "integer"
autocrop = true
shader = "scanlines"
full_screen = true
status_bar = false
