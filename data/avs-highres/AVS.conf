# High Resolution configuration file.

# Slideshow delay in seconds
# Set to zero to disable the slideshow feature
slideshow_delay_secs = 4

# Any image with an index greater than or equal to this value will be displayed
slideshow_start_index = 3
# Any image with an index less than or equal to this value will be displayed
slideshow_end_index = 7


background = AVS:AmigaVisionBG.iff
empty_screenshot = AVS:AmigaVisionEmpty.iff
font = AmigaVision.font
font_size = 14
font_leading = 2
mode = $19004
depth = 8
lock_colors = 16
menu_x = 4
menu_y = 24
menu_width = 30
menu_height = 24
menu_color = $0fff
screenshot_x = 236
screenshot_y = 3
text_x = 269
text_y = 296
text_width = 48
text_height = 7
text_color = $0fff
text_background = $0000
blue_button_action = back
favs_path = WHDSaves:Favorites/
favs_name = Favorites
favs_empty = Favorites_empty.txt
hide_parent_dir = 0

qrcode_x = 607
qrcode_y = 253
qrcode_label_x = 598
# QR label settings:
#   -2 = image caption, matching QR width with a 2px gap above it
#   -1 = hidden
#  400 = original text caption at Y=400 (any nonnegative Y is supported)
qrcode_label_y = -2
qrcode_color = $09ae

mod_file_path = Data:Music/7 Launcher BGM

# 0 - 64
mod_volume = 64

mod_play_delay = 3
mod_fadeout_duration = 0

# The length of this list should be equal to font_size + font_leading

# Red tint
#copper_text_colors = $0f77, $0e66, $0d55, $0c44, $0933, $0822, $0811, $0800

# Green tint
#copper_text_colors = $07f7, $06e6, $05d5, $04c4, $03a3, $0292, $0181, $0080

# Blue tint. Keep compact to fit the 96-character value limit.
copper_text_colors = $0fff,$0fff,$0eee,$0eee,$0dde,$0dde,$0cce,$0cce,$09ad,$09ad,$089d,$089d,$088d,$088d,$088c,$088c
