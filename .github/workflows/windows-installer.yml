name: Windows installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/distro_emulators/**'
      - 'build/windows/**'
      - 'build/*windows_installer*.py'
      - 'build/package_distros.py'
      - 'build/test_package_emulators.py'
      - 'Makefile'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main]
    paths:
      - 'content/distro_emulators/**'
      - 'build/windows/**'
      - 'build/*windows_installer*.py'
      - 'build/package_distros.py'
      - 'build/test_package_emulators.py'
      - 'Makefile'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            build
            content/distro_emulators
      - name: Verify emulator packaging and local installer
        shell: pwsh
        run: |
          python -m unittest discover -v -s build -p test_fetch_windows_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer download tests failed' }
          python -m unittest discover -v -s build -p test_package_emulators.py
          if ($LASTEXITCODE -ne 0) { throw 'Emulator packaging tests failed' }
      - name: Compile setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is missing from the runner' }
          & $compiler build/windows/WinUAEShader.iss
          if ($LASTEXITCODE -ne 0) { throw 'Shader helper compilation failed' }
          & $compiler build/windows/AmigaVision.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify installation and upgrades
        shell: pwsh
        run: ./build/windows/Test-Installer.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: AmigaVision-Windows-Setup
          path: build/windows/output/Install AmigaVision for Windows.exe
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: AmigaVision-installer-test-logs
          path: build/windows/output/test-logs/
          if-no-files-found: ignore
